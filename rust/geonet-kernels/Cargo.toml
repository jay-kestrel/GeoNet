# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "geonet-kernels"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Compute-only native kernel scaffolding for GeoNet"

[lib]
name = "geonet_kernels"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.28.3", features = ["abi3-py37"] }
numpy = "=0.28.0"
ndarray = "=0.17.2"
rayon = "=1.11.0"

[dev-dependencies]
pyo3 = { version = "=0.28.3", features = ["auto-initialize"] }
