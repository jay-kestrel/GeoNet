name: ci
on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies (numba stack for the stage-5 kernel tests)
        run: pip install numpy numba scikit-fmm matplotlib dask distributed rasterio psutil pytest tifffile
      - name: Run test suite (GRASS-dependent smoke test auto-skips)
        run: python -m pytest tests -v
